# Publishes the game to GitHub Pages: the main branch (releases) at the site root
# and the dev branch at /dev. Runs whenever either branch is pushed.
name: Deploy site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - name: Put main at the root and dev at /dev
        run: |
          mkdir -p _site/dev
          cp main/index.html _site/
          [ -d main/design ] && cp -r main/design _site/
          cp dev/index.html _site/dev/
          [ -d dev/design ] && cp -r dev/design _site/dev/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
